<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Men's Day</title>
<meta name="description" content="A little surprise for my favourite man.">
<meta name="theme-color" content="#fbf0bd">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c5283d'/%3E%3Cpath d='M32 50 14 32a10 10 0 0 1 18-6 10 10 0 0 1 18 6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@500;700&family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 8-petal flower, coloured through currentColor + --core -->
    <symbol id="flower" viewBox="-50 -50 100 100">
      <g fill="currentColor" stroke="#5b1a2b" stroke-width="2.4" stroke-linejoin="round">
        <ellipse cx="0" cy="-26" rx="13" ry="21"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(45)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(90)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(135)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(180)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(225)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(270)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="21" transform="rotate(315)"/>
      </g>
      <circle r="13" fill="#ffd84d" stroke="#5b1a2b" stroke-width="2.4"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 32 30">
      <path d="M16 29C6 21 1 15.5 1 9.6 1 4.8 4.6 1.5 8.8 1.5c3 0 5.4 1.6 7.2 4.4 1.8-2.8 4.2-4.4 7.2-4.4 4.2 0 7.8 3.3 7.8 8.1C31 15.5 26 21 16 29z" fill="currentColor" stroke="#5b1a2b" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="star" viewBox="0 0 40 40">
      <path d="M20 2l5.3 12.2L38 15.6l-9.6 8.6 2.9 13.1L20 30.4 8.7 37.3l2.9-13.1L2 15.6l12.7-1.4z" fill="currentColor" stroke="#5b1a2b" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="bow" viewBox="0 0 80 60">
      <g fill="currentColor" stroke="#5b1a2b" stroke-width="2.4" stroke-linejoin="round">
        <path d="M40 30 8 8c-5 8-5 36 0 44z"/>
        <path d="M40 30 72 8c5 8 5 36 0 44z"/>
        <path d="M40 30 28 58l12-8 12 8z"/>
        <rect x="32" y="21" width="16" height="18" rx="6"/>
      </g>
    </symbol>
    <symbol id="web" viewBox="0 0 60 60">
      <g fill="none" stroke="#5b1a2b" stroke-width="1.8" stroke-linecap="round">
        <path d="M2 2 58 58M30 0v60M0 30h60M58 2 2 58"/>
        <path d="M30 30 18 12 4 22 12 42 30 52 48 42 56 22 42 12z" transform="translate(0 0)"/>
        <path d="M30 30 24 20 14 26 18 38 30 42 42 38 46 26 36 20z"/>
      </g>
    </symbol>
    <symbol id="dumbbell" viewBox="0 0 80 40">
      <g fill="currentColor" stroke="#5b1a2b" stroke-width="2.4" stroke-linejoin="round">
        <rect x="4" y="12" width="9" height="16" rx="3"/>
        <rect x="13" y="5" width="11" height="30" rx="3"/>
        <rect x="24" y="17" width="32" height="6" rx="2"/>
        <rect x="56" y="5" width="11" height="30" rx="3"/>
        <rect x="67" y="12" width="9" height="16" rx="3"/>
      </g>
    </symbol>
    <!-- a little original "hero" sticker head: mask with eyes -->
    <symbol id="hero" viewBox="0 0 60 70">
      <path d="M30 4C14 4 6 18 6 34c0 18 10 32 24 32s24-14 24-32C54 18 46 4 30 4z" fill="currentColor" stroke="#5b1a2b" stroke-width="2.4"/>
      <path d="M30 4v62M6 34h48M12 18c10 6 26 6 36 0M12 50c10-6 26-6 36 0" fill="none" stroke="#5b1a2b" stroke-width="1.5" opacity=".55"/>
      <path d="M11 30c4-8 14-8 18 0-4 6-14 8-18 0zM49 30c-4-8-14-8-18 0 4 6 14 8 18 0z" fill="#fff" stroke="#5b1a2b" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <!-- sunset-with-two-people placeholder for polaroids -->
    <symbol id="ph-sunset" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f8f"/><stop offset=".55" stop-color="#e0567a"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs>
      <rect width="200" height="160" fill="url(#sky)"/>
      <circle cx="100" cy="104" r="26" fill="#ffe9a8"/>
      <path d="M0 118c30-10 56-6 100-2s70-8 100 2v42H0z" fill="#2a1d3d"/>
      <g fill="#150d22"><circle cx="86" cy="96" r="7"/><path d="M76 138c0-24 4-30 10-30s10 6 10 30z"/><circle cx="116" cy="92" r="7.5"/><path d="M105 138c0-28 4-34 11-34s11 6 11 34z"/></g>
    </symbol>
    <symbol id="ph-heart" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="160" fill="#f5c6d6"/>
      <circle cx="40" cy="30" r="50" fill="#ffd9e3"/><circle cx="170" cy="140" r="60" fill="#f0a9c1"/>
      <use href="#heart" x="55" y="35" width="90" height="85" style="color:#c5283d"/>
    </symbol>
    <symbol id="ph-field" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="160" fill="#bfe3f6"/>
      <circle cx="160" cy="34" r="16" fill="#fff6c2"/>
      <path d="M0 100c40-14 80-14 120-4s60 4 80-4v68H0z" fill="#6fbf4e"/>
      <path d="M0 126c50-10 100-10 200 0v34H0z" fill="#4da13a"/>
      <g fill="#fff" stroke="#5b1a2b" stroke-width="2"><circle cx="70" cy="104" r="6"/><circle cx="130" cy="108" r="6"/></g>
    </symbol>
    <symbol id="ph-skyline" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="160" fill="#1f2a5c"/>
      <g fill="#ffe28a"><circle cx="30" cy="30" r="1.8"/><circle cx="80" cy="18" r="1.4"/><circle cx="140" cy="36" r="1.8"/><circle cx="176" cy="16" r="1.4"/><circle cx="110" cy="52" r="1.2"/></g>
      <circle cx="150" cy="62" r="20" fill="#fff3c4"/><circle cx="158" cy="56" r="18" fill="#1f2a5c"/>
      <path d="M0 160V104h22V84h20v30h18V94h24v22h16V70h22v46h18V98h20v62z" fill="#0e1330"/>
    </symbol>
  </defs>
</svg>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="drift" id="drift" aria-hidden="true"></div>

<main id="app">

  <!-- 1 · BOUQUET -->
  <section class="scene" id="s-bouquet" data-scene="bouquet" aria-label="A surprise">
    <div class="center">
      <p class="hint hint--top" id="bq-hint"><span>Click on the bouquet for a surprise</span></p>
      <button class="bouquet" id="bouquet" type="button" aria-label="Open the bouquet">
        <svg viewBox="0 0 320 420" role="img" aria-hidden="true">
          <!-- wrapping -->
          <path d="M160 410 38 168c40 26 84 40 122 40s82-14 122-40z" fill="#3f5fa8" stroke="#5b1a2b" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M160 410 92 190c22 10 46 16 68 16s46-6 68-16z" fill="#6c8bd6" stroke="#5b1a2b" stroke-width="3" stroke-linejoin="round" opacity=".95"/>
          <g fill="#fff" opacity=".85"><circle cx="110" cy="232" r="4"/><circle cx="160" cy="250" r="4"/><circle cx="210" cy="232" r="4"/><circle cx="135" cy="290" r="3.4"/><circle cx="185" cy="290" r="3.4"/><circle cx="160" cy="336" r="3"/></g>
          <!-- flowers -->
          <g class="bq-flowers">
            <use href="#flower" x="30"  y="56"  width="110" height="110" style="color:#c5283d"/>
            <use href="#flower" x="180" y="56"  width="110" height="110" style="color:#3f5fa8"/>
            <use href="#flower" x="100" y="6"   width="125" height="125" style="color:#e23a52"/>
            <use href="#flower" x="2"   y="112" width="100" height="100" style="color:#6c8bd6"/>
            <use href="#flower" x="218" y="112" width="100" height="100" style="color:#c5283d"/>
            <use href="#flower" x="105" y="96"  width="115" height="115" style="color:#f4f1ff"/>
          </g>
          <!-- ribbon -->
          <path d="M138 200h44l8 18h-60z" fill="#c5283d" stroke="#5b1a2b" stroke-width="3" stroke-linejoin="round"/>
          <use href="#bow" x="112" y="196" width="96" height="72" style="color:#c5283d"/>
        </svg>
      </button>
      <p class="tap">tap · tap · tap</p>
    </div>
  </section>

  <!-- 2 · HEADLINE + ENVELOPE -->
  <section class="scene" id="s-letter" data-scene="letter" aria-label="A letter">
    <div class="center letter-stage">
      <div class="stickers" aria-hidden="true">
        <svg class="st st-heart-a"  viewBox="0 0 32 30" style="color:#ff7ea8"><use href="#heart"/></svg>
        <svg class="st st-hero"     viewBox="0 0 60 70" style="color:#c5283d"><use href="#hero"/></svg>
        <svg class="st st-dumb"     viewBox="0 0 80 40" style="color:#3f5fa8"><use href="#dumbbell"/></svg>
        <svg class="st st-heart-b"  viewBox="0 0 32 30" style="color:#c5283d"><use href="#heart"/></svg>
        <svg class="st st-web"      viewBox="0 0 60 60"><use href="#web"/></svg>
        <svg class="st st-star"     viewBox="0 0 40 40" style="color:#ffd84d"><use href="#star"/></svg>
      </div>

      <h1 class="headline"><span class="hl-a">Happy</span> <span class="hl-b">Men's</span> <span class="hl-c">Day</span></h1>
      <p class="to" id="to-line"></p>

      <button class="envelope" id="envelope" type="button" aria-expanded="false" aria-controls="paper">
        <span class="env-back"></span>
        <span class="paper" id="paper" role="region" aria-label="Letter">
          <span class="paper-inner" id="paper-text"></span>
        </span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-seal"><svg viewBox="0 0 32 30"><use href="#heart"/></svg></span>
      </button>
      <p class="tap" id="env-hint">tap the envelope to read my letter</p>
    </div>
    <nav class="pager"><button class="pg pg--next" data-go="collage" id="next-letter" hidden>next &raquo;</button></nav>
  </section>

  <!-- 3 · COLLAGE -->
  <section class="scene" id="s-collage" data-scene="collage" aria-label="Our little world">
    <div class="collage">
      <h2 class="balloon" id="balloon" aria-label="My man"></h2>

      <figure class="polaroid pol-a" style="--r:-4deg">
        <i class="tape tape-a"></i>
        <div class="ph"><svg viewBox="0 0 200 160"><use href="#ph-sunset"/></svg></div>
        <figcaption>favourite person</figcaption>
      </figure>

      <p class="note note-a" style="--r:-2deg" data-note="0"></p>
      <p class="note note-b" style="--r:1.5deg" data-note="1"></p>
      <p class="note note-c" style="--r:-1deg" data-note="2"></p>

      <figure class="polaroid pol-b" style="--r:3.5deg">
        <i class="tape tape-b"></i>
        <div class="ph"><svg viewBox="0 0 200 160"><use href="#ph-field"/></svg></div>
        <figcaption>just us</figcaption>
      </figure>

      <figure class="polaroid pol-c" style="--r:-2.5deg">
        <i class="tape tape-a"></i>
        <div class="ph"><svg viewBox="0 0 200 160"><use href="#ph-skyline"/></svg></div>
        <figcaption>late night talks</figcaption>
      </figure>

      <figure class="polaroid pol-d" style="--r:4deg">
        <i class="tape tape-b"></i>
        <div class="ph"><svg viewBox="0 0 200 160"><use href="#ph-heart"/></svg></div>
        <figcaption>forever my favourite</figcaption>
      </figure>

      <svg class="deco bow-d"   viewBox="0 0 80 60" style="color:#c5283d" aria-hidden="true"><use href="#bow"/></svg>
      <span class="stamp stamp-a" style="--r:-6deg" id="stamp-0"></span>
      <span class="stamp stamp-b" style="--r:5deg"  id="stamp-1"></span>
      <svg class="deco hero-d"  viewBox="0 0 60 70" style="color:#3f5fa8" aria-hidden="true"><use href="#hero"/></svg>
    </div>
    <nav class="pager">
      <button class="pg pg--back" data-go="letter">&laquo; back</button>
      <button class="pg pg--next" data-go="final">next &raquo;</button>
    </nav>
  </section>

  <!-- 4 · FINAL -->
  <section class="scene" id="s-final" data-scene="final" aria-label="One last thing">
    <div class="center final">
      <div class="card">
        <p class="card-eyebrow">for you</p>
        <h2 id="final-title"></h2>
        <p class="card-sub">You are not just special today. You are special every single day.</p>
        <button class="cta" id="cta" type="button">Click for your final surprise &raquo;</button>
        <p class="reveal" id="reveal" aria-live="polite"></p>
      </div>
      <p class="made">made with love, just for you</p>
    </div>
    <nav class="pager">
      <button class="pg pg--back" data-go="collage">&laquo; back</button>
      <button class="pg pg--next" data-go="bouquet" id="replay" hidden>replay &raquo;</button>
    </nav>
  </section>

</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
